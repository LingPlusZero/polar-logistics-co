services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: polar_logistics
      MYSQL_USER: polar
      MYSQL_PASSWORD: polar
      MYSQL_ROOT_PASSWORD: root
    ports:
      # 只綁本機，避免同一網路的其他裝置連到使用預設密碼的開發資料庫
      - "127.0.0.1:33060:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build: ./docker/php
    volumes:
      - ./apps/api:/var/www/html
      # vendor 放在 volume，避免 Windows bind mount 拖慢 composer 與執行速度
      - api-vendor:/var/www/html/vendor
      # 關閉 PHP 的詳細錯誤輸出與版本資訊（資安），只把錯誤寫進 log
      - ./docker/php/conf.d/security.ini:/usr/local/etc/php/conf.d/zz-security.ini:ro
    depends_on:
      mysql:
        condition: service_healthy

  # 產生開發用自簽憑證（已存在就略過），讓 API 走 HTTPS
  certs:
    image: alpine/openssl
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -f /certs/dev.crt ] || openssl req -x509 -nodes -newkey rsa:2048 -days 825
        -keyout /certs/dev.key -out /certs/dev.crt -subj /CN=localhost
        -addext subjectAltName=DNS:localhost,DNS:nginx,IP:127.0.0.1
    volumes:
      - dev-certs:/certs

  nginx:
    image: nginx:1.27-alpine
    ports:
      # 80 只轉址到 HTTPS，API 請用 https://localhost:8443
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api:/var/www/html:ro
      - dev-certs:/etc/nginx/certs:ro
    depends_on:
      php:
        condition: service_started
      certs:
        condition: service_completed_successfully

  website:
    image: node:22-alpine
    working_dir: /workspace/apps/website
    command: sh -c "npm install && npm run dev -- --host --port 5173"
    environment:
      API_PROXY_TARGET: https://nginx
    ports:
      - "5173:5173"
    volumes:
      - ./apps/website:/workspace/apps/website
      - ./shared:/workspace/shared
      - website-node-modules:/workspace/apps/website/node_modules

  admin:
    image: node:22-alpine
    working_dir: /workspace/apps/admin
    command: sh -c "npm install && npm run dev -- --host --port 5174"
    environment:
      API_PROXY_TARGET: https://nginx
    ports:
      - "5174:5174"
    volumes:
      - ./apps/admin:/workspace/apps/admin
      - ./shared:/workspace/shared
      - admin-node-modules:/workspace/apps/admin/node_modules

volumes:
  mysql-data:
  api-vendor:
  dev-certs:
  website-node-modules:
  admin-node-modules:
